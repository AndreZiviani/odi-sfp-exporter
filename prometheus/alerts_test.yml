# promtool unit tests for alerts.yml: `make rules` runs them.
#
# Each case feeds a synthetic series set and asserts which alerts are firing
# at a given time. An empty exp_alerts asserts that nothing fires, which is
# how the healthy-stick cases guard against a rule that fires on every stick.

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # A healthy stick: O5, services up, optics in range, nothing fires.
  - interval: 1m
    input_series:
      - series: 'up{job="odi",instance="s1"}'
        values: '1x60'
      - series: 'gpon_exporter_up{job="odi",instance="s1"}'
        values: '1x60'
      - series: 'gpon_onu_state{job="odi",instance="s1"}'
        values: '5x60'
      - series: 'gpon_omci_up{job="odi",instance="s1"}'
        values: '1x60'
      - series: 'gpon_omci_services{job="odi",instance="s1"}'
        values: '6x60'
      - series: 'gpon_rx_power_dbm{job="odi",instance="s1"}'
        values: '-20x60'
      - series: 'gpon_tx_power_dbm{job="odi",instance="s1"}'
        values: '2.4x60'
      - series: 'gpon_bias_current_ma{job="odi",instance="s1"}'
        values: '13x60'
      - series: 'gpon_temperature_celsius{job="odi",instance="s1"}'
        values: '40x60'
      - series: 'gpon_voltage_volts{job="odi",instance="s1"}'
        values: '3.3x60'
      - series: 'gpon_uptime_seconds{job="odi",instance="s1"}'
        values: '9000+60x60'
      - series: 'gpon_config_info{job="odi",instance="s1",file="lastgood.xml",hash="76ed442e5512"}'
        values: '1x60'
      - series: 'gpon_config_mtime_seconds{job="odi",instance="s1",file="lastgood.xml"}'
        values: '1790641247x60'
      - series: 'gpon_alarm{job="odi",instance="s1",alarm="los"}'
        values: '0x60'
      - series: 'gpon_uncommitted{job="odi",instance="s1"}'
        values: '0x60'
      - series: 'gpon_safe_mode{job="odi",instance="s1"}'
        values: '0x60'
      - series: 'gpon_safe_mode_unacknowledged{job="odi",instance="s1"}'
        values: '0x60'
      - series: 'gpon_host_autoneg_fallback{job="odi",instance="s1"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 60m, alertname: OdiUncommittedImage, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiSafeModeBoot, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiSafeModeUnacknowledged, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiHostLinkFallback, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiExporterDown, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiExporterAbsent, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiOnuNotOperational, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiGponAlarmCritical, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiOmciNoServices, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiRxPowerLow, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiTxPowerOutOfRange, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiRebooted, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiConfigChanged, exp_alerts: []}
      - {eval_time: 60m, alertname: OdiConfigFileMissing, exp_alerts: []}

  # The exporter stops answering: up goes to 0 and every gpon_* series
  # goes stale. Down fires, Absent must not (the failing scrape explains it).
  - interval: 1m
    input_series:
      - series: 'up{job="odi",instance="s1"}'
        values: '1x30 0x30'
      - series: 'gpon_exporter_up{job="odi",instance="s1"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 45m
        alertname: OdiExporterDown
        exp_alerts:
          - exp_labels: {severity: critical, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: exporter not answering"
              description: >-
                The scrape of s1 has failed for 5 minutes. Either the stick
                is down or unreachable, or metricsd is not running (it
                respawns under init on odi-oss, so a stuck one is a bug
                worth a look).
      - {eval_time: 45m, alertname: OdiExporterAbsent, exp_alerts: []}

  # The target vanishes from service discovery: no up, no gpon_*.
  - interval: 1m
    input_series:
      - series: 'up{job="odi",instance="s1"}'
        values: '1x30'
      - series: 'gpon_exporter_up{job="odi",instance="s1"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 50m
        alertname: OdiExporterAbsent
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: no exporter data for 10 minutes"
              description: "s1 exported gpon_exporter_up within the last day and has not for 10 minutes, and no failing scrape explains it: the target was removed from the scrape config, or relabelling changed its labels."
      - {eval_time: 50m, alertname: OdiExporterDown, exp_alerts: []}

  # Ranged but not provisioned, then the ONU drops out of O5.
  - interval: 1m
    input_series:
      - series: 'gpon_onu_state{job="odi",instance="s1"}'
        values: '5x20 1x20'
      - series: 'gpon_omci_services{job="odi",instance="s1"}'
        values: '0x40'
      - series: 'gpon_alarm{job="odi",instance="s1",alarm="los"}'
        values: '0x20 1x20'
      - series: 'gpon_alarm{job="odi",instance="s1",alarm="sd"}'
        values: '0x5 1x35'
    alert_rule_test:
      - eval_time: 15m
        alertname: OdiOmciNoServices
        exp_alerts:
          - exp_labels: {severity: critical, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: in O5 with no OMCI services"
              description: "The ONU is ranged but the OLT has provisioned no service for 5 minutes. Usually an identity the OLT accepts for ranging but not for service: check the serial, PLOAM password, LOID and VLAN against the last config backup (gpon_config_info)."
      - {eval_time: 15m, alertname: OdiOnuNotOperational, exp_alerts: []}
      - eval_time: 15m
        alertname: OdiGponAlarm
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1, alarm: sd}
            exp_annotations:
              summary: "s1: GPON alarm sd"
              description: "sd has been asserted for 5 minutes. sf and sd are signal fail and signal degrade: the ONU raises them when the downstream bit error rate crosses the thresholds the OLT set (G.984.3 11.1.3). Only the stock firmware reports them; odi-oss reports los, lof and lom only, so this rule stays silent there. On odi-oss v1.3.0 or later the counters behind the error rate are exported: see gpon_ds_fec_codewords_total and gpon_ds_bip_error_bits_total."
      - eval_time: 30m
        alertname: OdiOnuNotOperational
        exp_alerts:
          - exp_labels: {severity: critical, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: ONU in O1, not O5"
              description: >-
                The ONU has not been in O5 (operation) for 2 minutes: the
                OLT has not ranged it or has deactivated it. No service.
      - eval_time: 30m
        alertname: OdiGponAlarmCritical
        exp_alerts:
          - exp_labels: {severity: critical, job: odi, instance: s1, alarm: los}
            exp_annotations:
              summary: "s1: GPON alarm los"
              description: "los has been asserted for a minute: loss of signal, frame or PLOAM message. The downstream is gone or unusable."
      # Not in O5 any more, so no-services is the ONU state alert job now.
      - {eval_time: 30m, alertname: OdiOmciNoServices, exp_alerts: []}

  # One service of six goes away.
  - interval: 1m
    input_series:
      - series: 'gpon_omci_services{job="odi",instance="s1"}'
        values: '6x60 5x60'
    alert_rule_test:
      - eval_time: 90m
        alertname: OdiOmciServicesDropped
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: fewer OMCI services than earlier"
              description: "5 services now, fewer than at some point in the last 6 hours. The OLT removed one (a VoIP or IPTV service, often), or a reprovision did not complete."
      - {eval_time: 50m, alertname: OdiOmciServicesDropped, exp_alerts: []}

  # CRC errors on the PON side.
  - interval: 1m
    input_series:
      - series: 'gpon_port_receive_errors_total{job="odi",instance="s1",port="2",kind="crc_align"}'
        values: '0+2x60'
      - series: 'gpon_port_receive_errors_total{job="odi",instance="s1",port="0",kind="crc_align"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: OdiPortReceiveErrors
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1, port: "2"}
            exp_annotations:
              summary: "s1: receive errors on port 2"
              description: "30 malformed frames (CRC, fragments, jabbers, undersize) in 15 minutes on port 2 (2 is the PON side, 0 the host side, 3 the CPU), sustained for 15 minutes."

  # Port 3 undersize is the OMCI replies (0.18/s on a line whose OLT
  # polls): no alert. A CRC error on port 3 still is one.
  - interval: 1m
    input_series:
      - series: 'gpon_port_receive_errors_total{job="odi",instance="s1",port="3",kind="undersize"}'
        values: '0+11x60'
      - series: 'gpon_port_receive_errors_total{job="odi",instance="s1",port="3",kind="crc_align"}'
        values: '0x30 0+2x30'
    alert_rule_test:
      - {eval_time: 25m, alertname: OdiPortReceiveErrors, exp_alerts: []}
      - eval_time: 60m
        alertname: OdiPortReceiveErrors
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1, port: "3"}
            exp_annotations:
              summary: "s1: receive errors on port 3"
              description: "30 malformed frames (CRC, fragments, jabbers, undersize) in 15 minutes on port 3 (2 is the PON side, 0 the host side, 3 the CPU), sustained for 15 minutes."

  # Optics against absolute limits.
  - interval: 1m
    input_series:
      - series: 'gpon_rx_power_dbm{job="odi",instance="s1"}'
        values: '-26x30 -28x30'
      - series: 'gpon_tx_power_dbm{job="odi",instance="s1"}'
        values: '0.2x60'
      - series: 'gpon_temperature_celsius{job="odi",instance="s1"}'
        values: '75x30 85x30'
      - series: 'gpon_voltage_volts{job="odi",instance="s1"}'
        values: '3.1x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: OdiRxPowerLow
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: rx power -26.00 dBm"
              description: >-
                Received optical power is within 2 dB of the class B+
                receiver sensitivity (-27 dBm). Clean the connectors, check
                the drop fibre for bends.
      - {eval_time: 20m, alertname: OdiRxPowerCritical, exp_alerts: []}
      - eval_time: 50m
        alertname: OdiRxPowerCritical
        exp_alerts:
          - exp_labels: {severity: critical, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: rx power -28.00 dBm out of range"
              description: "Received optical power is outside the class B+ receiver range (-27 to -8 dBm). Expect errors or loss of signal."
      - eval_time: 20m
        alertname: OdiTxPowerOutOfRange
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: tx power 0.20 dBm"
              description: "Launch power is outside the class B+ range (+0.5 to +5 dBm). Low launch power with a rising bias current is an ageing laser."
      - eval_time: 20m
        alertname: OdiModuleTemperatureHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: module at 75.0 C"
              description: "The transceiver has been above the 70 C commercial limit for 10 minutes. Lasers age fast when hot; check the airflow around the host port."
      - {eval_time: 20m, alertname: OdiModuleTemperatureCritical, exp_alerts: []}
      - eval_time: 50m
        alertname: OdiModuleTemperatureCritical
        exp_alerts:
          - exp_labels: {severity: critical, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: module at 85.0 C"
              description: "The transceiver has been above 80 C for 5 minutes."
      - eval_time: 20m
        alertname: OdiSupplyVoltageOutOfRange
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: supply 3.100 V"
              description: "The 3.3 V supply from the host port is outside +-5%."

  # A week of steady optics, then the bias climbs 30% and rx power falls
  # 3 dB. 10 minute samples keep a week of input short.
  - interval: 10m
    input_series:
      - series: 'gpon_bias_current_ma{job="odi",instance="s1"}'
        values: '13x1008 17x72'
      - series: 'gpon_rx_power_dbm{job="odi",instance="s1"}'
        values: '-20x1008 -23x72'
    alert_rule_test:
      # 7 days in: still flat, nothing.
      - {eval_time: 7d, alertname: OdiLaserBiasRising, exp_alerts: []}
      - {eval_time: 7d, alertname: OdiRxPowerDropped, exp_alerts: []}
      # 7 days plus 3 hours: the rx drop has held for over an hour, the
      # bias rise not yet for 6.
      - eval_time: 171h
        alertname: OdiRxPowerDropped
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: rx power 2 dB below its 7-day average"
              description: "The hourly mean of received power has been more than 2 dB under the 7-day mean for an hour. Something in the optical path got worse: a connector, a splice, a bend."
      - {eval_time: 171h, alertname: OdiLaserBiasRising, exp_alerts: []}
      - eval_time: 176h
        alertname: OdiLaserBiasRising
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: laser bias 25% above its 7-day average"
              description: "The hourly mean of the laser bias current has been more than 25% above its 7-day mean for 6 hours. The laser is ageing or its cooling got worse; compare with gpon_temperature_celsius and gpon_tx_power_dbm, and plan a replacement stick."

  # A watchdog reset, then a loop of resets.
  - interval: 1m
    input_series:
      - series: 'gpon_uptime_seconds{job="odi",instance="s1"}'
        values: '60+60x60'
      - series: 'gpon_last_reset_reason{job="odi",instance="s1",reason="wdt_client",client="omcid"}'
        values: '1x60'
      - series: 'gpon_boot_count{job="odi",instance="s1"}'
        values: '1x10 2x10 3x10 4x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: OdiWatchdogReset
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1, reason: wdt_client, client: omcid}
            exp_annotations:
              summary: "s1: rebooted by wdt_client omcid"
              description: >-
                The previous boot ended in wdt_client (client omcid), not in
                a reboot someone asked for. Read /proc/odi_ramlog_prev on
                the stick (or the diagnostics bundle) before the next reset
                replaces it. Clears an hour after the boot.
      - eval_time: 5m
        alertname: OdiRebooted
        exp_alerts:
          - exp_labels: {severity: info, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: booted 6m 0s ago"
              description: "Any reboot, including a power cycle and one asked for. Clears 10 minutes after the boot."
      - {eval_time: 20m, alertname: OdiResetLoop, exp_alerts: []}
      - eval_time: 35m
        alertname: OdiResetLoop
        exp_alerts:
          - exp_labels: {severity: critical, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: 3 resets in an hour"
              description: "The stick keeps resetting. Each boot is 75 to 80 s off the line. gpon_last_reset_reason says what fired."
      # An hour after the boot the reset reason stops alerting.
      - {eval_time: 60m, alertname: OdiWatchdogReset, exp_alerts: []}

  # A reboot someone asked for does not alert as a watchdog reset.
  - interval: 1m
    input_series:
      - series: 'gpon_uptime_seconds{job="odi",instance="s1"}'
        values: '60+60x10'
      - series: 'gpon_last_reset_reason{job="odi",instance="s1",reason="reboot"}'
        values: '1x10'
    alert_rule_test:
      - {eval_time: 5m, alertname: OdiWatchdogReset, exp_alerts: []}

  # Memory under the margin above the watchdog floor.
  - interval: 1m
    input_series:
      - series: 'gpon_memory_bytes{job="odi",instance="s1",kind="free"}'
        values: '1048576x30'
      - series: 'gpon_memory_bytes{job="odi",instance="s1",kind="buffers"}'
        values: '524288x30'
      - series: 'gpon_memory_bytes{job="odi",instance="s1",kind="cached"}'
        values: '1048576x30'
      - series: 'gpon_memory_bytes{job="odi",instance="s1",kind="total"}'
        values: '28188672x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OdiMemoryLow
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: 2.5MiB reclaimable"
              description: "Free plus buffers plus cached memory has been under 4 MiB for 10 minutes. The kernel watchdog resets the stick at 2 MiB available."

  # lastgood.xml gets a new hash at 20m; lastgood_hs.xml disappears at 40m.
  - interval: 1m
    input_series:
      - series: 'gpon_exporter_up{job="odi",instance="s1"}'
        values: '1x120'
      - series: 'gpon_config_info{job="odi",instance="s1",file="lastgood.xml",hash="76ed442e5512"}'
        values: '1x20'
      - series: 'gpon_config_info{job="odi",instance="s1",file="lastgood.xml",hash="c78135e7630c"}'
        values: '_x20 1x100'
      - series: 'gpon_config_mtime_seconds{job="odi",instance="s1",file="lastgood.xml"}'
        values: '1790641247x20 1790642447x100'
      - series: 'gpon_config_mtime_seconds{job="odi",instance="s1",file="lastgood_hs.xml"}'
        values: '1790641247x40'
    alert_rule_test:
      - {eval_time: 10m, alertname: OdiConfigChanged, exp_alerts: []}
      - eval_time: 25m
        alertname: OdiConfigChanged
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1, file: lastgood.xml}
            exp_annotations:
              summary: "s1: lastgood.xml changed"
              description: "lastgood.xml on the config partition has a new hash. If nobody saved or restored settings, compare with the last backup (odi-oss tools/config-backup.sh keeps one per change). Clears 30 minutes after the change."
      # 30 minutes on, the old hash has aged out of the window.
      - {eval_time: 60m, alertname: OdiConfigChanged, exp_alerts: []}
      - {eval_time: 35m, alertname: OdiConfigFileMissing, exp_alerts: []}
      - eval_time: 55m
        alertname: OdiConfigFileMissing
        exp_alerts:
          - exp_labels: {severity: critical, job: odi, instance: s1, file: lastgood_hs.xml}
            exp_annotations:
              summary: "s1: lastgood_hs.xml is gone"
              description: "lastgood_hs.xml is no longer on the config partition. It holds the provisioning identity (lastgood_hs.xml: GPON serial and MAC; lastgood.xml: PLOAM password, LOID, VLAN). Do not reboot: restore from the last backup first."

  # A trial left uncommitted: a warning after 30 minutes, gone once committed.
  # A stick with no slot state (older image, stock firmware) never fires.
  - interval: 1m
    input_series:
      - series: 'gpon_uncommitted{job="odi",instance="s1"}'
        values: '1x60 0x30'
      - series: 'gpon_exporter_up{job="odi",instance="s2"}'
        values: '1x90'
    alert_rule_test:
      - {eval_time: 25m, alertname: OdiUncommittedImage, exp_alerts: []}
      - eval_time: 45m
        alertname: OdiUncommittedImage
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: running an uncommitted image"
              description: "For 30 minutes s1 has run a slot that sw_commit does not name in at least one copy of the U-Boot environment (gpon_boot_slot, gpon_committed_slot say which): a trial boot. The next reset boots the other slot. Once the trial is checked, commit it on the stick with nv commit <slot> and slot-state.sh; otherwise reboot it back."
      - {eval_time: 75m, alertname: OdiUncommittedImage, exp_alerts: []}

  # The stuck ONU: O5 throughout, the BWmap allocation counter grows for 30
  # minutes (s1, s2) and then stands still on s1 only. s3 is in O1 with a flat
  # counter (the state alert covers it, not this one). Uncorrectable FEC
  # codewords climb on s4 and stay at 0 on s2.
  - interval: 1m
    input_series:
      - series: 'gpon_onu_state{job="odi",instance="s1"}'
        values: '5x60'
      - series: 'gpon_ds_bwmap_allocations_total{job="odi",instance="s1"}'
        values: '0+124200x30 3726000x30'
      - series: 'gpon_onu_state{job="odi",instance="s2"}'
        values: '5x60'
      - series: 'gpon_ds_bwmap_allocations_total{job="odi",instance="s2"}'
        values: '0+124200x60'
      - series: 'gpon_ds_fec_codewords_total{job="odi",instance="s2",result="uncorrectable"}'
        values: '0x60'
      - series: 'gpon_ds_fec_codewords_total{job="odi",instance="s2",result="corrected"}'
        values: '0+1500000x60'
      - series: 'gpon_onu_state{job="odi",instance="s3"}'
        values: '1x60'
      - series: 'gpon_ds_bwmap_allocations_total{job="odi",instance="s3"}'
        values: '0x60'
      - series: 'gpon_ds_fec_codewords_total{job="odi",instance="s4",result="uncorrectable"}'
        values: '0+600x60'
    alert_rule_test:
      - {eval_time: 25m, alertname: OdiOnuNoUpstreamGrants, exp_alerts: []}
      - {eval_time: 5m, alertname: OdiFecUncorrectable, exp_alerts: []}
      - eval_time: 45m
        alertname: OdiOnuNoUpstreamGrants
        exp_alerts:
          - exp_labels: {severity: critical, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: in O5 but the OLT grants no upstream time"
              description: >-
                The ONU reports O5 but its BWmap allocations have not moved
                for 5 minutes: the OLT no longer grants it upstream
                bandwidth, so nothing leaves the stick. How many
                allocations a served ONU gets a second is the OLT's choice
                (about 500 on one OLT, about 2,000 on two others), so
                compare with this stick's usual rate, not with a fixed
                number. Needs an odi-oss kernel with the GPON line counters
                (gpon_ds_bwmap_allocations_total).
      - eval_time: 45m
        alertname: OdiFecUncorrectable
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s4}
            exp_annotations:
              summary: "s4: uncorrectable FEC codewords"
              description: >-
                Downstream FEC codewords the ONU could not correct have been
                arriving for 10 minutes: data is being lost on the fibre.
                Check gpon_rx_power_dbm and clean or inspect the connectors.

  # A safe-mode boot: critical after a minute. Then a normal boot with the
  # record left: the boot alert clears, the unacknowledged one fires after
  # 30 minutes, and goes once acknowledged. A stick whose image has no safe
  # mode (no series) never fires.
  - interval: 1m
    input_series:
      - series: 'gpon_safe_mode{job="odi",instance="s1"}'
        values: '1x20 0x80'
      - series: 'gpon_safe_mode_unacknowledged{job="odi",instance="s1"}'
        values: '1x80 0x20'
      - series: 'gpon_exporter_up{job="odi",instance="s2"}'
        values: '1x100'
    alert_rule_test:
      - {eval_time: 0m, alertname: OdiSafeModeBoot, exp_alerts: []}
      - eval_time: 5m
        alertname: OdiSafeModeBoot
        exp_alerts:
          - exp_labels: {severity: critical, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: booted in safe mode, the PON is off"
              description: "s1 is on a safe-mode boot: a run of power cycles, each cut before the stick had been up a minute, made it a recovery boot. For this boot the PON is off (no service through this stick), the host port runs auto-negotiation, and the web UI and root accept the default password admin. Nothing saved changed but HOST_AUTONEG, if that was off. If nobody did this on purpose, check the stick power; either way, reboot it to return to the saved configuration."
      - {eval_time: 5m, alertname: OdiSafeModeUnacknowledged, exp_alerts: []}
      - {eval_time: 30m, alertname: OdiSafeModeBoot, exp_alerts: []}
      - {eval_time: 40m, alertname: OdiSafeModeUnacknowledged, exp_alerts: []}
      - eval_time: 60m
        alertname: OdiSafeModeUnacknowledged
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: a safe-mode boot was not acknowledged"
              description: "s1 booted in safe mode earlier (a run of short power cycles) and is back on its saved configuration, but the record is still there. It may have cleared HOST_AUTONEG. Check what happened, then acknowledge it on the web UI banner."
      - {eval_time: 90m, alertname: OdiSafeModeUnacknowledged, exp_alerts: []}

  # The boot fallback: a warning after 5 minutes, gone at the next boot that
  # brings the forced link up.
  - interval: 1m
    input_series:
      - series: 'gpon_host_autoneg_fallback{job="odi",instance="s1"}'
        values: '1x30 0x30'
    alert_rule_test:
      - {eval_time: 3m, alertname: OdiHostLinkFallback, exp_alerts: []}
      - eval_time: 10m
        alertname: OdiHostLinkFallback
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1}
            exp_annotations:
              summary: "s1: host port fell back to auto-negotiation"
              description: "HOST_AUTONEG is off on s1, but this boot found no host link with auto-negotiation off, so the host port runs it on. Check that the router port runs 1000 Mb/s full duplex with auto-negotiation off and try off again from the web UI, or set the host port back to on. It clears at the next boot that brings the link up with auto-negotiation off."
      - {eval_time: 45m, alertname: OdiHostLinkFallback, exp_alerts: []}

  # The module's own flags, and an unreadable module. The module in the first
  # series set sits below its own Rx-power low alarm (and so its warning) for
  # the whole hour; the second cannot be read for the hour; the third is fine.
  - interval: 1m
    input_series:
      - series: 'gpon_transceiver_alarm{job="odi",instance="s1",kind="alarm",condition="rx_power_low"}'
        values: '0x10 1x50'
      - series: 'gpon_transceiver_alarm{job="odi",instance="s1",kind="warning",condition="rx_power_low"}'
        values: '0x10 1x50'
      - series: 'gpon_transceiver_alarm{job="odi",instance="s1",kind="alarm",condition="temperature_high"}'
        values: '0x60'
      - series: 'gpon_transceiver_up{job="odi",instance="s1"}'
        values: '1x60'
      - series: 'gpon_diag_up{job="odi",instance="s1"}'
        values: '1x60'
      - series: 'gpon_transceiver_up{job="odi",instance="s2"}'
        values: '1x20 0x40'
      - series: 'gpon_diag_up{job="odi",instance="s2"}'
        values: '1x60'
      - series: 'gpon_transceiver_up{job="odi",instance="s3"}'
        values: '0x60'
      - series: 'gpon_diag_up{job="odi",instance="s3"}'
        values: '0x60'
    alert_rule_test:
      - {eval_time: 15m, alertname: OdiTransceiverAlarm, exp_alerts: []}
      - eval_time: 30m
        alertname: OdiTransceiverAlarm
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s1, kind: alarm, condition: rx_power_low}
            exp_annotations:
              summary: "s1: module alarm rx_power_low"
              description: >-
                The transceiver module reports the rx_power_low alarm,
                against the limits stored in the module, for 10 minutes. For
                rx_power_low look at gpon_rx_power_dbm and the fibre; for
                temperature, bias_current or voltage see the matching
                readings.
      - {eval_time: 30m, alertname: OdiTransceiverWarning, exp_alerts: []}
      - eval_time: 55m
        alertname: OdiTransceiverWarning
        exp_alerts:
          - exp_labels: {severity: info, job: odi, instance: s1, kind: warning, condition: rx_power_low}
            exp_annotations:
              summary: "s1: module warning rx_power_low"
              description: >-
                The transceiver module reports the rx_power_low warning, the
                inner limit stored in the module, for 30 minutes.
      - eval_time: 30m
        alertname: OdiTransceiverUnreadable
        exp_alerts:
          - exp_labels: {severity: warning, job: odi, instance: s2}
            exp_annotations:
              summary: "s2: the transceiver cannot be read"
              description: >-
                The optical readings of s2 are missing: the read of the
                module on its I2C port failed for 5 minutes. The optics
                alerts cannot fire while this lasts.
      # s3 has no diag at all: that is OdiDiagDown, not an unreadable module.
